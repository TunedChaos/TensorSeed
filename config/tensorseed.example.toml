# Tensorseed example configuration (https://tensorseed.dev).
# Copy to ~/.config/tensorseed/tensorseed.toml (Windows:
# %APPDATA%\tensorseed\tensorseed.toml) and edit.
# Default data directories are ~/.local/share/tensorseed/ on Unix and
# %LOCALAPPDATA%\tensorseed\ on Windows. Path values below use the Unix
# form; on Windows you can omit them to get the platform default, or set
# them explicitly.
# Secrets are NEVER stored here: fields ending in _env name the environment
# variable that holds the secret. Any key can be overridden with
# TENSORSEED_<SECTION>__<KEY>, for example TENSORSEED_CHIA__FEE_MOJOS=1000.

[general]
state_db = "~/.local/share/tensorseed/state.sqlite"
staging_dir = "/srv/tensorseed/staging"
seed_dir = "/srv/tensorseed/seed"
keep_local_seed = true
max_concurrent_downloads = 2
download_dir = "."               # pull writes to <download_dir>/<org>/<name> unless --out is given

[catalog]
backend = "file"                 # "chia" | "file"; the public catalog uses the file backend
name = "tensorseed"              # logical catalog name, bound into every entry signature
publisher_pubkey = "RWS4/z1UPQ4ezmjrcpKqDYpqyn5h1WUS2oDs1B73Dh91kVzzNIZd03xd"  # official Tuned Chaos catalog key (id CE1E0E3D543DFFB8)
# publisher_seckey_file = "~/.config/tensorseed/publisher.key"   # only needed to publish
                                 # (create with `tensorseed catalog keygen`; password from
                                 # TENSORSEED_KEY_PASSWORD or a prompt)
publisher_name = ""              # shown in ts/v1/catalog, written by `catalog create`
publisher_contact = ""           # email or URL for takedown requests
publisher_policy_url = ""
chain_check = "strict"           # "strict" | "warn" | "off": check the file catalog against the
                                 # Chia store (spec 6.14). Unset: strict when chia.catalog_store_id
                                 # is set, off (with a notice) when it is empty.

[chia]
rpc_url = "https://localhost:8562"
ssl_cert = "~/.chia/mainnet/config/ssl/data_layer/private_data_layer.crt"
ssl_key = "~/.chia/mainnet/config/ssl/data_layer/private_data_layer.key"
# ca_cert = "~/.chia/mainnet/config/ssl/ca/private_ca.crt"
catalog_store_id = "3dcd43dced47a32f8e38e8ec77f583d8d1bafe1ab24e381538e50a36034b7a76"  # official Tensorseed mainnet store; publishers of their own catalog set theirs
fee_mojos = 0
confirm_poll_secs = 20
confirm_timeout_secs = 1800
catalog_mirror_urls = []         # public URLs of your DataLayer HTTP server (port 8575)
mirror_amount_mojos = 0
chain_source = "light"           # "light": verify the published chain-proof.json (no Chia software);
                                 # "datalayer": get the proof from your own DataLayer at rpc_url
coin_api_urls = ["https://api.coinset.org"]   # read only full node RPC compatible endpoints used to
                                 # look up the store coin; add more (or your own node) to spread trust
chain_grace_blocks = 192         # accept a proof for the previous root this many blocks (about an
                                 # hour) after the store moved on, while caches catch up

[file]
base_url = "https://catalog.tensorseed.dev/"   # example URL: whatever public URL serves your published
                                               # catalog files (head.json, deltas/, snapshots/, .minisig)
mirror_urls = []                 # static hosts carrying the same files (also see [mirrors])
state_dir = "~/.local/share/tensorseed/catalog"
snapshot_every = 64              # full snapshot every N revisions
head_ttl_secs = 604800           # head expires after 7 days unless re-signed
torrent = true                   # also publish each snapshot as a torrent (not implemented yet)

# The Hugging Face token is optional (needed only for gated or private
# repos and higher rate limits) and is NEVER written in this file: an inline
# `token = "..."` is rejected. Resolution order: the env var named by
# token_env, then token_file, then the file written by `tensorseed hf login`,
# then the Hugging Face CLI token (HF_TOKEN_PATH, $HF_HOME/token, or
# ~/.cache/huggingface/token). A token file must not be readable by group
# or others (chmod 600), or Tensorseed refuses to use it.
[huggingface]
endpoint = "https://huggingface.co"
token_env = "HF_TOKEN"
token_file = ""                  # optional explicit file (chmod 600)

# BitTorrent (spec section 7.1; results in docs/M0-TORRENT-SPIKE.md).
# harvest writes t/<name>.torrent next to each revision; `tensorseed seed`
# serves them. `pull` uses the swarm first when a torrent is present (HTTP
# mirrors and the Hub are failover). `--seed-after` seeds after a verified pull.
# pull does not open a listen port; only seed, serve, and --seed-after do.
[torrent]
create = true                    # build a torrent for every harvested revision
hybrid = true                    # v1+v2; the built-in engine (librqbit) needs hybrids
piece_length = 0                 # 0 = auto: 4 MiB, doubled to at most 16384 pieces, max 64 MiB
trackers = []                    # e.g. "udp://tracker.example.org:1337/announce"
listen_addr = "0.0.0.0"
listen_port = 6881               # open this TCP port to seed to the internet
upload_limit_kbps = 0            # 0 = unlimited
dht = true
lsd = false                      # BEP 14 local service discovery on the LAN
peers = []                       # "host:port" peers to dial, e.g. your seed boxes
pull_swarm = true                # pull uses the swarm when the manifest has a torrent; --no-swarm to skip
swarm_no_peer_secs = 30          # fall back to HTTP if no peer connects (0 = disable; ignored by --swarm-only)
swarm_stall_secs = 60            # fall back to HTTP if no byte progress (0 = disable; ignored by --swarm-only)
swarm_timeout_secs = 600         # overall cap on the swarm pass, then HTTP fills the rest

# HTTP downloads (spec 8.2). A connect failure or repeated transient
# failures marks a mirror origin dead in general.state_db. Later files and
# later runs skip it until this cooldown expires, a download from that
# origin succeeds, or you pass --retry-dead-mirrors. A 404, 401, or 403
# is not a dead mirror (gated or missing Hub files fall through). Hugging
# Face is tracked the same way.
[fetch]
dead_mirror_cooldown_secs = 3600 # 0 disables persistence; in-run marks still apply
# Byte sources, in order: "swarm", "hub", "mirrors". No duplicates.
source_order = ["swarm", "hub", "mirrors"]

# Where published objects go: signed catalog files under "<catalog name>/" and,
# for webseeds, model files under "t/". Default is local disk only: no account
# anywhere, seeding works from local files, and the directory can optionally
# be exposed by any static web server. Object storage is optional and works
# with any S3 compatible provider. See docs/SPEC.md section 10.1.
[storage]
local_dir = "~/.local/share/tensorseed/publish"   # always written; this is what the seeder serves
local_public_base_url = ""       # set if a web server exposes local_dir; enables it as a webseed
local_priority = 100             # webseed order of local_public_base_url (lower first)

# Optional remote copies: named, repeatable [[storage.target]] blocks. Publish
# (catalog files, and harvested model files) writes to local_dir plus every
# target with enabled = true and upload = true. After the swarm, pull tries
# the Hub, then webseeds and mirrors by priority (lower first), unless
# fetch.source_order says otherwise. Several blocks may use the
# same provider (different buckets, regions, or accounts).
#
# Common fields: name (unique), provider, enabled (true), priority (100),
# upload (true), public_base_url ("": upload only; else "<url>t/" becomes a
# webseed and "<url>" a catalog mirror), bucket, prefix, path_style (default
# per provider), and access_key_env / secret_key_env: the NAMES of the
# environment variables holding the credentials. Secrets never go in this
# file; values that do not look like variable names are rejected.
#
# Provider fields and derived endpoints (endpoint = "..." overrides any of them):
#   r2      account_id or account_id_env -> https://<account>.r2.cloudflarestorage.com, region auto
#   b2      region (required)            -> https://s3.<region>.backblazeb2.com
#   vultr   region (ewr1) or hostname    -> https://<region>.vultrobjects.com
#   wasabi  region (us-east-1)           -> https://s3.<region>.wasabisys.com
#   minio   endpoint (http://localhost:9000), path style
#   aws     region (required), AWS default endpoint, virtual hosted style
#   s3      endpoint (required): any other S3 compatible service, path style unless set
#   local   dir: a second directory (another disk, an NFS mount)
#   http    public_base_url only: a host something else fills (advertised, never uploaded)
#   torrent dir (default storage.local_dir): a seeding root for `tensorseed seed`
#
# Cost notes (check current pricing and terms yourself): R2 charges no egress;
# B2 has low storage prices with free egress up to 3x stored data and through
# Bandwidth Alliance CDNs such as Cloudflare; Vultr sells flat monthly plans
# bundling storage and transfer; Wasabi charges no egress while egress stays
# at or below stored volume, with a minimum storage duration; AWS bills egress.
#
# The example below is a multi-provider operator: two R2 buckets on different
# accounts, B2 in two regions (one advertised only), Vultr, Wasabi, MinIO, AWS
# and a NAS. All disabled here, so the default stays local disk only.

[[storage.target]]
name = "r2-primary"
provider = "r2"
enabled = false
priority = 10
account_id_env = "TS_R2_ACCOUNT_ID"
bucket = "tensorseed"
public_base_url = "https://models.example.org/"    # R2 custom domain or r2.dev URL
access_key_env = "TS_R2_KEY"
secret_key_env = "TS_R2_SECRET"

[[storage.target]]
name = "r2-backup"
provider = "r2"
enabled = false
priority = 40
account_id = "0123456789abcdef0123456789abcdef"
bucket = "tensorseed-backup"
access_key_env = "TS_R2B_KEY"
secret_key_env = "TS_R2B_SECRET"

[[storage.target]]
name = "b2-us"
provider = "b2"
enabled = false
priority = 20
region = "us-west-004"
bucket = "tensorseed"
public_base_url = "https://f004.backblazeb2.com/file/tensorseed/"
access_key_env = "TS_B2_KEY_ID"
secret_key_env = "TS_B2_APP_KEY"

[[storage.target]]
name = "b2-eu"
provider = "b2"
enabled = false
priority = 30
upload = false                   # filled by a B2 replication rule; only advertised
region = "eu-central-003"
bucket = "tensorseed-eu"
public_base_url = "https://f003.backblazeb2.com/file/tensorseed-eu/"

[[storage.target]]
name = "vultr-sjc"
provider = "vultr"
enabled = false
region = "sjc1"
bucket = "tensorseed"
public_base_url = "https://tensorseed.sjc1.vultrobjects.com/"
access_key_env = "TS_VULTR_KEY"
secret_key_env = "TS_VULTR_SECRET"

[[storage.target]]
name = "wasabi"
provider = "wasabi"
enabled = false
region = "eu-central-1"
bucket = "tensorseed"
access_key_env = "TS_WASABI_KEY"
secret_key_env = "TS_WASABI_SECRET"

[[storage.target]]
name = "minio-lab"
provider = "minio"
enabled = false
endpoint = "http://minio.lan:9000"
bucket = "tensorseed"
public_base_url = "http://minio.lan:9000/tensorseed/"
access_key_env = "TS_MINIO_KEY"
secret_key_env = "TS_MINIO_SECRET"

[[storage.target]]
name = "aws"
provider = "aws"
enabled = false
priority = 90
region = "us-east-1"
bucket = "tensorseed"

[[storage.target]]
name = "nas"
provider = "local"
enabled = false
dir = "/mnt/nas/tensorseed"

# Mirror lists. `file` is your own list of [[mirror]] blocks (see
# config/mirrors.example.toml; edit with `tensorseed mirror add|remove`).
# With fetch_published, the publisher signed "<catalog>/mirrors.toml" is
# fetched on sync and pull, verified against catalog.publisher_pubkey, and
# cached. Publish yours with `tensorseed mirror publish`.
[mirrors]
file = "~/.config/tensorseed/mirrors.toml"
fetch_published = true

[backup.sia]
enabled = false
renterd_url = "http://localhost:9980"
password_env = "RENTERD_PASSWORD"

[policy]
license_allowlist = ["apache-2.0", "mit", "bsd-3-clause", "bsd-2-clause", "cc-by-4.0", "cc0-1.0", "openrail", "openrail++"]
attribution_licenses = []        # e.g. ["llama3.1", "gemma"]; enables attribution handling
allow_gated = false
allow_pickle_formats = false

[[targets]]
repo = "org/name"
type = "model"
include = ["*.safetensors", "*.json", "LICENSE*", "README.md"]
exclude = []

# Automatic harvest: `tensorseed harvest` (one pass) or `tensorseed harvest
# --watch` (daemon). Each new revision is downloaded with hash verification
# and resume into "<storage.local_dir>/t/<repo>@<commit12>/", gets a signed
# manifest, is staged and committed to the catalog, and is uploaded to every
# enabled [[storage.target]] with upload = true. State lives in general.state_db, so reruns skip
# finished revisions and resume interrupted ones. See docs/SPEC.md section 13.
[harvest]
# Explicit repos: plain ids, or tables with per-repo overrides. Use
# allow_license to mirror a repo whose license is not on the allowlist,
# typically your own `license: other` repo; the policy stays strict for
# everything else and the manifest still records the license as unknown.
#   repos = ["org/name", { id = "me/my-model", allow_license = ["other"] }]
repos = []                       # explicit model ids
datasets = []                    # explicit dataset ids (needs include_datasets), same forms
authors = []                     # discover repos by these users or orgs
tags = []                        # discovered repos must have all of these, e.g. ["safetensors"]
min_downloads = 0                # discovered repos need at least this many downloads
max_per_author = 100
license_allowlist = []           # empty: use [policy] license_allowlist
max_repo_bytes = 0               # skip revisions larger than this (0 = no cap)
disk_budget_bytes = 0            # total harvested bytes allowed (0 = unlimited)
include_datasets = false
allow_gated = false              # never fetch gated repos unless set (and HF_TOKEN accepted)
takedown = []                    # repo ids never to fetch
takedown_file = ""               # more ids, one per line
poll_interval_secs = 21600       # --watch: time between passes
request_delay_ms = 500           # pause between Hub API calls
max_retries = 5                  # on HTTP 429/5xx, honoring Retry-After
retry_base_ms = 2000
publish = true                   # sign and commit catalog entries (needs publisher_seckey_file)
upload = true                    # upload files to every enabled [[storage.target]] (upload = true)

[seed]                           # legacy keys, unused; `tensorseed serve` reads [serve] below
poll_interval_secs = 600
max_bytes = 2_000_000_000_000
select = ["org/*"]
latest_only = true
prune = true
serve_catalog = false

[serve]                          # `tensorseed serve`, the long running seeder (spec 8.3)
# Primary setup: pull the repos you care about, then serve them. fetch is
# off, so this does not download the rest of the catalog. select = ["*"]
# here means "seed any on-disk revision still in the catalog".
# To auto-follow (advanced): set fetch = true and name a repo or org, e.g.
# select = ["org/name"] or ["org/*"], plus a max_bytes disk budget.
# select = ["*"] with fetch = true downloads the whole catalog, up to
# max_bytes.
data_dir = "~/.local/share/tensorseed/serve"   # downloads (t/), catalog mirror, serve-state.json
                                 # Windows default: %LOCALAPPDATA%\tensorseed\serve
dirs = []                        # extra published trees (with t/) to seed from
sync_interval_secs = 300         # catalog sync period; takedowns apply within one period
select = ["*"]                   # with fetch = false: seed any on-disk catalog revision; [] seeds nothing
exclude = []                     # repo id globs never seeded
select_watchlist = false         # also select [harvest] repos and authors
types = []                       # "model", "dataset"; [] = both
license_classes = []             # "open", "attribution", "restricted", "unknown"; [] = any
latest_only = true               # only each repo's latest revision
max_bytes = 0                    # disk budget for everything seeded (0 = unlimited)
max_revision_bytes = 0           # skip revisions larger than this (0 = no cap)
fetch = false                    # do not download anything you did not already pull
fetch_swarm = true               # when fetch is on: try peers first, then webseeds, mirrors, the Hub
prune = true                     # delete downloaded copies (under data_dir) on takedown or deselect
upload_limit_kbps = 0            # 0 = torrent.upload_limit_kbps
download_limit_kbps = 0          # swarm download cap (0 = unlimited)
utp = true                       # uTP next to TCP (UDP on torrent.listen_port)
port_mapping = false             # NAT-PMP / UPnP IGD forward of the torrent port; opens a router port
port_mapping_lease_secs = 3600
http_listen = ""                 # e.g. "0.0.0.0:8080": serve seeded revisions as a webseed (t/)
http_upload_limit_kbps = 0
serve_catalog = false            # mirror the signed catalog files and serve them at /<catalog>/
health_listen = "127.0.0.1:6880" # JSON health endpoint; "" = off
check_timeout_secs = 3600        # longest piece check per revision before seeding
