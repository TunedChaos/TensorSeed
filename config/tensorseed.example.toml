# Tensorseed example configuration (https://tensorseed.dev).
# Copy to ~/.config/tensorseed/tensorseed.toml and edit.
# Secrets are NEVER stored here: fields ending in _env name the environment
# variable that holds the secret. Any key can be overridden with
# TENSORSEED_<SECTION>__<KEY>, for example TENSORSEED_CHIA__FEE_MOJOS=1000.

[general]
state_db = "~/.local/share/tensorseed/state.sqlite"
staging_dir = "/srv/tensorseed/staging"
seed_dir = "/srv/tensorseed/seed"
keep_local_seed = true
max_concurrent_downloads = 2
download_dir = "."               # pull writes to <download_dir>/<org>/<name> unless --out is given

[catalog]
backend = "chia"                 # "chia" | "file"; see docs/SPEC.md sections 6.0 and 6.8
name = "tensorseed"              # logical catalog name, bound into every entry signature
publisher_pubkey = ""            # pinned minisign public key ("RW..."), same for every backend
# publisher_seckey_file = "~/.config/tensorseed/publisher.key"   # only needed to publish
                                 # (create with `tensorseed catalog keygen`; password from
                                 # TENSORSEED_KEY_PASSWORD or a prompt)
publisher_name = ""              # shown in ts/v1/catalog, written by `catalog create`
publisher_contact = ""           # email or URL for takedown requests
publisher_policy_url = ""

[chia]
rpc_url = "https://localhost:8562"
ssl_cert = "~/.chia/mainnet/config/ssl/data_layer/private_data_layer.crt"
ssl_key = "~/.chia/mainnet/config/ssl/data_layer/private_data_layer.key"
# ca_cert = "~/.chia/mainnet/config/ssl/ca/private_ca.crt"
catalog_store_id = ""            # set by `tensorseed catalog create`
fee_mojos = 0
confirm_poll_secs = 20
confirm_timeout_secs = 1800
catalog_mirror_urls = []         # public URLs of your DataLayer HTTP server (port 8575)
mirror_amount_mojos = 0

[file]
base_url = "https://catalog.tensorseed.dev/"   # example URL: whatever public URL serves your published
                                               # catalog files (head.json, deltas/, snapshots/, .minisig)
mirror_urls = []                 # static hosts carrying the same files (also see [mirrors])
state_dir = "~/.local/share/tensorseed/catalog"
snapshot_every = 64              # full snapshot every N revisions
head_ttl_secs = 604800           # head expires after 7 days unless re-signed
torrent = true                   # also publish each snapshot as a torrent (pending M0)

[huggingface]
endpoint = "https://huggingface.co"
token_env = "HF_TOKEN"

[torrent]
hybrid = true
piece_length = 4194304           # placeholder, tune in M0
trackers = []
listen_port = 6881
upload_limit_kbps = 0            # 0 = unlimited
dht = true

# Where published objects go: signed catalog files under "<catalog name>/" and,
# for webseeds, model files under "t/". Default is local disk only: no account
# anywhere, seeding works from local files, and the directory can optionally
# be exposed by any static web server. Object storage is optional and works
# with any S3 compatible provider. See docs/SPEC.md section 10.1.
[storage]
local_dir = "~/.local/share/tensorseed/publish"   # always written; this is what the seeder serves
local_public_base_url = ""       # set if a web server exposes local_dir; enables it as a webseed
local_priority = 100             # webseed order of local_public_base_url (lower first)

# Optional remote copies: named, repeatable [[storage.target]] blocks. Publish
# (catalog files, and harvested model files) writes to local_dir plus every
# target with enabled = true and upload = true. Pull tries webseeds and
# mirrors by priority (lower first), then the Hub. Several blocks may use the
# same provider (different buckets, regions, or accounts).
#
# Common fields: name (unique), provider, enabled (true), priority (100),
# upload (true), public_base_url ("": upload only; else "<url>t/" becomes a
# webseed and "<url>" a catalog mirror), bucket, prefix, path_style (default
# per provider), and access_key_env / secret_key_env: the NAMES of the
# environment variables holding the credentials. Secrets never go in this
# file; values that do not look like variable names are rejected.
#
# Provider fields and derived endpoints (endpoint = "..." overrides any of them):
#   r2      account_id or account_id_env -> https://<account>.r2.cloudflarestorage.com, region auto
#   b2      region (required)            -> https://s3.<region>.backblazeb2.com
#   vultr   region (ewr1) or hostname    -> https://<region>.vultrobjects.com
#   wasabi  region (us-east-1)           -> https://s3.<region>.wasabisys.com
#   minio   endpoint (http://localhost:9000), path style
#   aws     region (required), AWS default endpoint, virtual hosted style
#   s3      endpoint (required): any other S3 compatible service, path style unless set
#   local   dir: a second directory (another disk, an NFS mount)
#   http    public_base_url only: a host something else fills (advertised, never uploaded)
#   torrent reserved; seeding is not implemented yet (list magnets in mirrors.toml)
#
# Cost notes (check current pricing and terms yourself): R2 charges no egress;
# B2 has low storage prices with free egress up to 3x stored data and through
# Bandwidth Alliance CDNs such as Cloudflare; Vultr sells flat monthly plans
# bundling storage and transfer; Wasabi charges no egress while egress stays
# at or below stored volume, with a minimum storage duration; AWS bills egress.
#
# The example below is a multi-provider operator: two R2 buckets on different
# accounts, B2 in two regions (one advertised only), Vultr, Wasabi, MinIO, AWS
# and a NAS. All disabled here, so the default stays local disk only.

[[storage.target]]
name = "r2-primary"
provider = "r2"
enabled = false
priority = 10
account_id_env = "TS_R2_ACCOUNT_ID"
bucket = "tensorseed"
public_base_url = "https://models.example.org/"    # R2 custom domain or r2.dev URL
access_key_env = "TS_R2_KEY"
secret_key_env = "TS_R2_SECRET"

[[storage.target]]
name = "r2-backup"
provider = "r2"
enabled = false
priority = 40
account_id = "0123456789abcdef0123456789abcdef"
bucket = "tensorseed-backup"
access_key_env = "TS_R2B_KEY"
secret_key_env = "TS_R2B_SECRET"

[[storage.target]]
name = "b2-us"
provider = "b2"
enabled = false
priority = 20
region = "us-west-004"
bucket = "tensorseed"
public_base_url = "https://f004.backblazeb2.com/file/tensorseed/"
access_key_env = "TS_B2_KEY_ID"
secret_key_env = "TS_B2_APP_KEY"

[[storage.target]]
name = "b2-eu"
provider = "b2"
enabled = false
priority = 30
upload = false                   # filled by a B2 replication rule; only advertised
region = "eu-central-003"
bucket = "tensorseed-eu"
public_base_url = "https://f003.backblazeb2.com/file/tensorseed-eu/"

[[storage.target]]
name = "vultr-sjc"
provider = "vultr"
enabled = false
region = "sjc1"
bucket = "tensorseed"
public_base_url = "https://tensorseed.sjc1.vultrobjects.com/"
access_key_env = "TS_VULTR_KEY"
secret_key_env = "TS_VULTR_SECRET"

[[storage.target]]
name = "wasabi"
provider = "wasabi"
enabled = false
region = "eu-central-1"
bucket = "tensorseed"
access_key_env = "TS_WASABI_KEY"
secret_key_env = "TS_WASABI_SECRET"

[[storage.target]]
name = "minio-lab"
provider = "minio"
enabled = false
endpoint = "http://minio.lan:9000"
bucket = "tensorseed"
public_base_url = "http://minio.lan:9000/tensorseed/"
access_key_env = "TS_MINIO_KEY"
secret_key_env = "TS_MINIO_SECRET"

[[storage.target]]
name = "aws"
provider = "aws"
enabled = false
priority = 90
region = "us-east-1"
bucket = "tensorseed"

[[storage.target]]
name = "nas"
provider = "local"
enabled = false
dir = "/mnt/nas/tensorseed"

# Mirror lists. `file` is your own list of [[mirror]] blocks (see
# config/mirrors.example.toml; edit with `tensorseed mirror add|remove`).
# With fetch_published, the publisher signed "<catalog>/mirrors.toml" is
# fetched on sync and pull, verified against catalog.publisher_pubkey, and
# cached. Publish yours with `tensorseed mirror publish`.
[mirrors]
file = "~/.config/tensorseed/mirrors.toml"
fetch_published = true

[backup.sia]
enabled = false
renterd_url = "http://localhost:9980"
password_env = "RENTERD_PASSWORD"

[policy]
license_allowlist = ["apache-2.0", "mit", "bsd-3-clause", "bsd-2-clause", "cc-by-4.0", "cc0-1.0", "openrail", "openrail++"]
attribution_licenses = []        # e.g. ["llama3.1", "gemma"]; enables attribution handling
allow_gated = false
allow_pickle_formats = false

[[targets]]
repo = "org/name"
type = "model"
include = ["*.safetensors", "*.json", "LICENSE*", "README.md"]
exclude = []

# Automatic harvest: `tensorseed harvest` (one pass) or `tensorseed harvest
# --watch` (daemon). Each new revision is downloaded with hash verification
# and resume into "<storage.local_dir>/t/<repo>@<commit12>/", gets a signed
# manifest, is staged and committed to the catalog, and is uploaded to every
# enabled [[storage.target]] with upload = true. State lives in general.state_db, so reruns skip
# finished revisions and resume interrupted ones. See docs/SPEC.md section 13.
[harvest]
repos = []                       # explicit model ids, e.g. ["org/name"]
datasets = []                    # explicit dataset ids (needs include_datasets)
authors = []                     # discover repos by these users or orgs
tags = []                        # discovered repos must have all of these, e.g. ["safetensors"]
min_downloads = 0                # discovered repos need at least this many downloads
max_per_author = 100
license_allowlist = []           # empty: use [policy] license_allowlist
max_repo_bytes = 0               # skip revisions larger than this (0 = no cap)
disk_budget_bytes = 0            # total harvested bytes allowed (0 = unlimited)
include_datasets = false
allow_gated = false              # never fetch gated repos unless set (and HF_TOKEN accepted)
takedown = []                    # repo ids never to fetch
takedown_file = ""               # more ids, one per line
poll_interval_secs = 21600       # --watch: time between passes
request_delay_ms = 500           # pause between Hub API calls
max_retries = 5                  # on HTTP 429/5xx, honoring Retry-After
retry_base_ms = 2000
publish = true                   # sign and commit catalog entries (needs publisher_seckey_file)
upload = true                    # upload files to every enabled [[storage.target]] (upload = true)

[seed]
poll_interval_secs = 600
max_bytes = 2_000_000_000_000
select = ["org/*"]
latest_only = true
prune = true
serve_catalog = false
