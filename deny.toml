# cargo-deny configuration for Tensorseed.
# Run: cargo deny check
# Tensorseed is licensed AGPL-3.0-or-later, so every dependency must use a
# license that can be combined with it.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# Licenses compatible with AGPL-3.0-or-later.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    # "or later" GPL-2.0 code may be used under GPL-3.0, which is compatible.
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
# INCOMPATIBLE: GPL-2.0-only (and LGPL-2.0-only / LGPL-2.1-only, which cannot be
# relicensed to GPL-3.0 terms here) are deliberately NOT in the allow list, so
# cargo-deny rejects any dependency that uses them. Do not add them.
private = { ignore = false }
# Keep compatible licenses listed even before a dependency uses them.
unused-allowed-license = "allow"

# Mozilla root certificate data bundled by rustls (via reqwest). CDLA-Permissive-2.0
# is a permissive data license compatible with AGPL-3.0-or-later; allowed only here.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
