# Minimal config for contrib/systemd/tensorseed-serve.service: follow the
# official catalog with strict chain checking, and seed only revisions you
# already pulled (or copied into serve.dirs). It does not download the
# catalog on its own. Copy to /etc/tensorseed/tensorseed.toml and adjust.
# Every key is documented in config/tensorseed.example.toml.

[catalog]
backend = "file"
name = "tensorseed"
publisher_pubkey = "RWS4/z1UPQ4ezmjrcpKqDYpqyn5h1WUS2oDs1B73Dh91kVzzNIZd03xd"
chain_check = "strict"           # accept only catalog heads anchored on Chia (SPEC 6.14)

[file]
base_url = "https://catalog.tensorseed.dev/"

[chia]
catalog_store_id = "3dcd43dced47a32f8e38e8ec77f583d8d1bafe1ab24e381538e50a36034b7a76"
chain_source = "light"           # verify the published chain-proof.json; no Chia software needed
coin_api_urls = ["https://api.coinset.org"]

[torrent]
listen_port = 6881               # forward TCP and UDP on the router, or set serve.port_mapping
upload_limit_kbps = 0

[serve]
select = ["*"]                   # among what is on disk, seed any catalog revision
fetch = false                    # do not download anything you did not already pull
# To auto-follow one org instead of pulling by hand (this can fill a disk):
# select = ["TunedChaos/*"]
# fetch = true
# max_bytes = 50_000_000_000     # disk budget when fetch is on (0 = unlimited)
http_listen = ""                 # "0.0.0.0:8080" to also act as an HTTP webseed
serve_catalog = false            # with http_listen: mirror the signed catalog too
port_mapping = false             # true asks the router (NAT-PMP / UPnP) to open listen_port
health_listen = "127.0.0.1:6880"
