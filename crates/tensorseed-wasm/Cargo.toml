[package]
name = "tensorseed-wasm"
description = "WebAssembly bindings for Tensorseed verification: catalogs, served-weights claims, revocations, and signed responses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
hex.workspace = true
serde_json.workspace = true
tensorseed-core = { workspace = true, default-features = false }
tensorseed-verify = { workspace = true, default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
# Key generation and test signatures are only used by native tests.
ed25519-dalek.workspace = true
k256.workspace = true
sha3.workspace = true
tensorseed-verify = { workspace = true, features = ["keygen"] }

[lints]
workspace = true
