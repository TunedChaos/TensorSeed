[package]
name = "tensorseed-verify"
description = "Tensorseed catalog verification: minisign, signed-file chain, and chain proofs (no network)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["keygen"]
# Secret-key generation and loading encrypted minisign key files.
keygen = ["dep:getrandom", "dep:scrypt"]

[dependencies]
base64.workspace = true
blake2.workspace = true
ed25519-dalek.workspace = true
getrandom = { workspace = true, optional = true }
hex.workspace = true
scrypt = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tensorseed-core = { workspace = true, default-features = false }
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true
