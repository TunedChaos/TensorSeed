[workspace]
resolver = "3"
members = [
    "crates/tensorseed-core",
    "crates/tensorseed-hf",
    "crates/tensorseed-verify",
    "crates/tensorseed-catalog",
    "crates/tensorseed-wasm",
    "crates/tensorseed-torrent",
    "crates/tensorseed-fetch",
    "crates/tensorseed-serve",
    "crates/tensorseed-app",
    "crates/tensorseed-cli",
]
# Tensorseed Desktop builds on its own (Tauri and webview libraries stay out
# of CLI, explorer, and release builds).
exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
authors = ["Tuned Chaos"]
repository = "https://tensorseed.dev"
homepage = "https://tensorseed.dev"

[workspace.dependencies]
tensorseed-core = { path = "crates/tensorseed-core", version = "0.2.0" }
tensorseed-hf = { path = "crates/tensorseed-hf", version = "0.2.0" }
tensorseed-verify = { path = "crates/tensorseed-verify", version = "0.2.0" }
tensorseed-catalog = { path = "crates/tensorseed-catalog", version = "0.2.0" }
tensorseed-wasm = { path = "crates/tensorseed-wasm", version = "0.2.0" }
tensorseed-torrent = { path = "crates/tensorseed-torrent", version = "0.2.0" }
tensorseed-fetch = { path = "crates/tensorseed-fetch", version = "0.2.0" }
tensorseed-serve = { path = "crates/tensorseed-serve", version = "0.2.0" }
tensorseed-app = { path = "crates/tensorseed-app", version = "0.2.0" }

anyhow = "1"
# HTTP serving for `tensorseed serve` (already in the tree through librqbit).
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
librqbit-upnp = "9.1.0"
network-interface = "2"
percent-encoding = "2"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
bytes = "1"
getrandom = "0.4"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
rpassword = "7"
rusqlite = { version = "0.42", features = ["bundled"] }
scrypt = { version = "0.12", default-features = false }
sha1 = "0.10"
toml = "0.8"
url = "2"
wiremock = "0.6"
async-trait = "0.1"
base64 = "0.23"
blake2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Public fallible functions document their errors and panics (`# Errors`, `# Panics`).
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# scrypt (encrypted publisher keys) is unusably slow without optimization.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Release archives (`just dist`): optimized, stripped, one codegen unit.
[profile.dist]
inherits = "release"
strip = "symbols"
lto = "thin"
codegen-units = 1
