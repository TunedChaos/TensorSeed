[workspace]
resolver = "3"
members = [
    "crates/tensorseed-core",
    "crates/tensorseed-hf",
    "crates/tensorseed-catalog",
    "crates/tensorseed-torrent",
    "crates/tensorseed-fetch",
    "crates/tensorseed-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["Tuned Chaos"]
repository = "https://tensorseed.dev"
homepage = "https://tensorseed.dev"

[workspace.dependencies]
tensorseed-core = { path = "crates/tensorseed-core", version = "0.1.0" }
tensorseed-hf = { path = "crates/tensorseed-hf", version = "0.1.0" }
tensorseed-catalog = { path = "crates/tensorseed-catalog", version = "0.1.0" }
tensorseed-torrent = { path = "crates/tensorseed-torrent", version = "0.1.0" }
tensorseed-fetch = { path = "crates/tensorseed-fetch", version = "0.1.0" }

anyhow = "1"
bytes = "1"
getrandom = "0.4"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
rpassword = "7"
rusqlite = { version = "0.42", features = ["bundled"] }
scrypt = { version = "0.12", default-features = false }
sha1 = "0.10"
url = "2"
wiremock = "0.6"
async-trait = "0.1"
base64 = "0.23"
blake2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
